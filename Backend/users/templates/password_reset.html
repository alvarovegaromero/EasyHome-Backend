<!DOCTYPE html>
<html>
<head>
    <title>Reset Password</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f2f2f2;
        /* Optional: Set a minimum viewport width for responsiveness on small screens */
        min-width: 320px; /* Adjust as needed */
      }
  
      .container {
        width: 90%; /* Responsive width for mobile devices */
        height: 40%; /* Responsive height for mobile devices */
        margin: 0 auto;
        padding: 20px;
        background-color: #fff;
        border-radius: 5px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      }
  
      h1 {
        text-align: center;
        margin-bottom: 20px;
      }
  
      h2 {
        text-align: center;
        margin-bottom: 20px;
      }
  
      input[type="password"] {
        width: 100%;
        padding: 10px;
        margin-bottom: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
      }
  
      button[type="button"] {
        width: 100%;
        padding: 10px;
        background-color: #2196F3;
        color: #fff;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
  
      button[type="button"]:hover {
        background-color: #1c87db;
      }
  
      /* Media queries for additional responsiveness */
      @media (min-width: 768px) {
        .container {
          width: 40%; /* Adjust width for desktop screens */
        }
      }
    </style>
</head>
<body>
    <div class="container">
        <h1>EasyHome</h1>
        <h2>Reset Password form</h2>
        <form>
            <input type="password" id="new-password" name="password" placeholder="New Password" required>
            <input type="password" id="confirm-password" name="confirm_password" placeholder="Confirm Password" required>
            <button type="button" onclick="resetPassword()">Reset Password</button>
        </form>
    </div>

    <script>
        function resetPassword() {
            var token = getTokenFromURL();
            var newPassword = document.getElementById("new-password").value;
            var confirmPassword = document.getElementById("confirm-password").value;
            
            var data = {
                token: token,
                new_password: newPassword,
                confirm_password: confirmPassword
            };

            var options = {
                method: 'POST', 
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            };

            var url = '/api/users/reset-password-request';

            fetch(url, options)
                .then(response => {
                    if (response.ok) {
                        console.log('The password was updated successfully.');
                    } else {
                        console.error('Error updating the password.');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                });
        }

        function getTokenFromURL() {
            var urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('token');
        }
    </script>
</body>
</html>
