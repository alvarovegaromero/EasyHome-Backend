<!DOCTYPE html>
<html>
  <head>
    <title>Reset Password</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f2f2f2;
        min-width: 320px;
      }

      .container {
        width: 90%;
        height: 40%;
        margin: 0 auto;
        padding: 20px;
        background-color: #fff;
        border-radius: 5px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      }

      h1 {
        text-align: center;
        margin-bottom: 20px;
      }

      h2 {
        text-align: center;
        margin-bottom: 20px;
      }

      input[type="password"] {
        width: 100%;
        padding: 10px;
        margin-bottom: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
      }

      button[type="button"] {
        width: 100%;
        padding: 10px;
        background-color: #2196F3;
        color: #fff;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }

      button[type="button"]:hover {
        background-color: #1c87db;
      }

      @media (min-width: 768px) {
        .container {
          width: 40%;
        }
      }

      .success-message {
        color: green;
        text-align: center;
        display: none;
      }

      .error-message {
        color: red;
        text-align: center;
        display: none;
    </style>
  </head>
  <body>
    <div class="container">
      <h1>EasyHome</h1>
      <h2>Reset Password form</h2>
      <form>
        <input
          type="password"
          id="new-password"
          name="password"
          placeholder="New Password"
          required
          aria-label="New Password"
        />
        <input
          type="password"
          id="confirm-password"
          name="confirm_password"
          placeholder="Confirm Password"
          required
          aria-label="Confirm Password"
        />
        <button type="button" onclick="resetPassword()" aria-label="Reset Password">Reset Password</button>
      </form>

      <p id="success-message" class="success-message"></p>
      <p id="error-message" class="error-message"></p>
    </div>

    <script>
      function resetPassword() {
        var newPassword = document.getElementById("new-password").value;
        var confirmPassword = document.getElementById("confirm-password").value;
        var token = getTokenFromURL();

        if(token === null){
          document.getElementById("error-message").innerText = "Error: Token not found";
          document.getElementById("error-message").aria-live = "Error: Token not found";
          document.getElementById("error-message").style.display = "block";
          return; // Exit the function
        }
        else if (newPassword === "") {
          document.getElementById("error-message").innerText = "Error: The passwords can't be empty";
          document.getElementById("error-message").aria-live = "Error: The passwords can't be empty";
          document.getElementById("error-message").style.display = "block";
          return; 
        } 
        else if (newPassword !== confirmPassword) {
          document.getElementById("error-message").innerText = "Error: The passwords do not match";
          document.getElementById("error-message").aria-live = "Error: The passwords do not match.";
          document.getElementById("error-message").style.display = "block";
          return; 
        } 
        
        document.getElementById("error-message").style.display = "none";
        
        var data = {
          token: token,
          new_password: newPassword,
          confirm_password: confirmPassword,
        };

        var options = {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify(data),
        };

        var url = "/api/users/reset-password-request";

        fetch(url, options)
          .then((response) => {
            if (response.ok) {
              alert("The password was updated successfully.");
              document.getElementById("success-message").innerText = "The password was updated successfully";
              document.getElementById("success-message").aria-live = "The password was updated successfully";
              document.getElementById("success-message").style.display = "block";
            } else {
              response.json().then((data) => {
                document.getElementById("error-message").innerText = "Error: " + data.error;
                document.getElementById("error-message").aria-live = "Error: " + data.error;
              });

              document.getElementById("error-message").style.display = "block";
              document.getElementById("success-message").style.display = "none";
            }
          })
          .catch((error) => {
            alert("Error:", error);
            document.getElementById("error-message").innerText = "Error: " + error;
            document.getElementById("error-message").aria-live = "Error: " + error;
            document.getElementById("error-message").style.display = "block";
            document.getElementById("success-message").style.display = "none";
          });
      }

      function getTokenFromURL() {
        var urlParams = new URLSearchParams(window.location.search);
        return urlParams.get("token");
      }
    </script>
  </body>
</html>
