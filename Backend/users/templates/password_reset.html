<!DOCTYPE html>
<html>
<head>
    <title>Reset Password</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f2f2f2;
        /* Optional: Set a minimum viewport width for responsiveness on small screens */
        min-width: 320px; /* Adjust as needed */
      }
  
      .container {
        width: 90%; /* Responsive width for mobile devices */
        height: 40%; /* Responsive height for mobile devices */
        margin: 0 auto;
        padding: 20px;
        background-color: #fff;
        border-radius: 5px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      }
  
      h1 {
        text-align: center;
        margin-bottom: 20px;
      }
  
      h2 {
        text-align: center;
        margin-bottom: 20px;
      }
  
      input[type="password"] {
        width: 100%;
        padding: 10px;
        margin-bottom: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
      }
  
      button[type="submit"] {
        width: 100%;
        padding: 10px;
        background-color: #2196F3;
        color: #fff;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
  
      button[type="submit"]:hover {
        background-color: #1c87db;
      }
  
      /* Media queries for additional responsiveness */
      @media (min-width: 768px) {
        .container {
          width: 40%; /* Adjust width for desktop screens */
        }
      }
    </style>
</head>
<body>
    <div class="container">
        <h1>EasyHome</h1>
        <h2>Reset Password form</h2>
        <form>
            <input type="password" name="password" placeholder="New Password" required>
            <input type="password" name="confirm_password" placeholder="Confirm Password" required>
            <button type="submit">Reset Password</button>
        </form>
    </div>
</body>
</html>
