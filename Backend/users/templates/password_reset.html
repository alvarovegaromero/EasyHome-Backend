<!DOCTYPE html>
<html>
<head>
    <title>Reset Password</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f2f2f2;
        min-width: 320px;
      }
  
      .container {
        width: 90%; 
        height: 40%; 
        margin: 0 auto;
        padding: 20px;
        background-color: #fff;
        border-radius: 5px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      }
  
      h1 {
        text-align: center;
        margin-bottom: 20px;
      }
  
      h2 {
        text-align: center;
        margin-bottom: 20px;
      }
  
      input[type="password"] {
        width: 100%;
        padding: 10px;
        margin-bottom: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
      }
  
      button[type="button"] {
        width: 100%;
        padding: 10px;
        background-color: #2196F3;
        color: #fff;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
  
      button[type="button"]:hover {
        background-color: #1c87db;
      }
  
      @media (min-width: 768px) {
        .container {
          width: 40%; 
        }
      }

      .success-message {
        color: green;
        text-align: center;
        display: none;
      }

      .error-message {
        color: red;
        text-align: center;
        display: none;
    </style>
</head>
<body>
    <div class="container">
        <h1>EasyHome</h1>
        <h2>Reset Password form</h2>
        <form>
            <input type="password" id="new-password" name="password" placeholder="New Password" required>
            <input type="password" id="confirm-password" name="confirm_password" placeholder="Confirm Password" required>
            <button type="button" onclick="resetPassword()">Reset Password</button>
        </form>

        <p id="success-message" class="success-message">
          Success! The password was updated successfully.
        </p>
        <p id="error-message" class="error-message">
          Error: Error updating the password. Please try again.
        </p>
        <p id="password-mismatch" class="error-message">
          Error: Passwords do not match.
        </p>
    </div>

    <script>
      document.getElementById("reset-password-form").addEventListener("submit", function (event) {
          event.preventDefault();
          var newPassword = document.getElementById("new-password").value;
          var confirmPassword = document.getElementById("confirm-password").value;

          if (newPassword === confirmPassword) {
            document.getElementById("password-mismatch").style.display = "none";
            resetPassword(newPassword);
          } else {
            document.getElementById("password-mismatch").style.display = "block";
          }
        }
      );

        function resetPassword() {
            var token = getTokenFromURL();
            var newPassword = document.getElementById("new-password").value;
            var confirmPassword = document.getElementById("confirm-password").value;
            
            var data = {
                token: token,
                new_password: newPassword,
                confirm_password: confirmPassword
            };

            var options = {
                method: 'POST', 
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            };

            var url = '/api/users/reset-password-request';

            fetch(url, options)
                .then(response => {
                    if (response.ok) {
                        alert('The password was updated successfully.');
                        document.getElementById("success-message").style.display = "block";
                        document.getElementById("error-message").style.display = "none";
                    } else {
                        alert('Error updating the password.');
                        document.getElementById("error-message").style.display = "block";
                        document.getElementById("success-message").style.display = "none";
                    }
                })
                .catch(error => {
                    alert('Error:', error);
                    document.getElementById("error-message").style.display = "block";
                    document.getElementById("success-message").style.display = "none";
                });
        }

        function getTokenFromURL() {
            var urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('token');
        }
    </script>
</body>
</html>
